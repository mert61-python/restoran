<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <!-- Tarayıcı otomatik çevirisini kapat: 3 dili zaten biz sunuyoruz.
       Aksi halde Chrome (ör. Arapça telefonda) tüm metni çevirip
       Türkçe alt-yazıyı ve İngilizceyi de Arapçaya döndürüyor. -->
  <meta name="google" content="notranslate">
  <title>Pazarcık Alabalık Dinlenme Tesisleri — Menü</title>
  <meta name="description" content="Pazarcık Canlı Alabalık · Et · Köfte · Balık — Menü & Galeri">
  <meta name="theme-color" content="#161616">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Yeni sürüm yayınlanınca sayfayı bir kez otomatik yenile — müşteri hiçbir şey yapmasın */
    if ("serviceWorker" in navigator) {
      var _pzHadCtrl = !!navigator.serviceWorker.controller, _pzReloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (_pzReloaded || !_pzHadCtrl) return;
        _pzReloaded = true;
        window.location.reload();
      });
    }
  </script>
</head>
<body class="notranslate">

  <!-- Açılış: logo + menüye giriş -->
  <div class="intro" id="intro">
    <div class="intro-ic">
      <img class="intro-logo" src="img/logo.jpeg" alt="Pazarcık Alabalık Dinlenme Tesisleri">
      <button class="intro-btn" id="introBtn" type="button">
        <span class="ib1">MENÜYE GİT</span>
        <span class="ib2">القائمة · MENU</span>
      </button>
    </div>
  </div>

  <div class="app">
    <header class="hero" id="hero">
      <div class="hero-split">
        <div class="hero-half left"></div>
        <div class="hero-half right"></div>
      </div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1 class="hero-title" id="restName"></h1>
        <p class="hero-tagline" id="restTagline"></p>
      </div>
      <span class="season-tag left">☀️ Yaz</span>
      <span class="season-tag right">❄️ Kış</span>
    </header>

    <div class="brandbar">
      <span class="flame" aria-hidden="true">🔥</span>
      <span class="offerings" id="offerings"></span>
      <span class="flame" aria-hidden="true">🔥</span>
    </div>

    <div class="topbar">
      <nav class="tabs" id="tabs" aria-label="Menü / Galeri">
        <button type="button" data-tab="menu" class="active">🍽️ <span id="tabMenu"></span></button>
        <button type="button" data-tab="gallery">📷 <span id="tabGallery"></span></button>
      </nav>
      <nav class="lang-switch" id="langSwitch" aria-label="Dil / Language">
        <button type="button" data-lang="tr">TR</button>
        <button type="button" data-lang="ar">عربي</button>
        <button type="button" data-lang="en">EN</button>
      </nav>
    </div>

    <main>
      <section id="menu" class="menu"></section>
      <section id="gallery" class="gallery" hidden></section>
    </main>

    <footer class="foot">
      <div class="foot-content">
        <div class="social">
          <div class="social-title" id="socialTitle">Bizi takip edin</div>
          <div class="social-links">
            <a class="social-link" href="https://www.instagram.com/pazarcikalabalik" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              <svg viewBox="0 0 512 512" width="52" height="52" aria-hidden="true" focusable="false">
                <defs>
                  <radialGradient id="igGrad" cx="30%" cy="107%" r="150%">
                    <stop offset="0%" stop-color="#fdf497"/>
                    <stop offset="5%" stop-color="#fdf497"/>
                    <stop offset="45%" stop-color="#fd5949"/>
                    <stop offset="60%" stop-color="#d6249f"/>
                    <stop offset="90%" stop-color="#285AEB"/>
                  </radialGradient>
                </defs>
                <rect width="512" height="512" rx="150" fill="url(#igGrad)"/>
                <rect x="141" y="141" width="230" height="230" rx="66" fill="none" stroke="#fff" stroke-width="30"/>
                <circle cx="256" cy="256" r="66" fill="none" stroke="#fff" stroke-width="30"/>
                <circle cx="382" cy="130" r="20" fill="#fff"/>
              </svg>
            </a>
            <a class="social-link" href="https://www.facebook.com/share/1CxG27CjeF/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
              <svg viewBox="0 0 512 512" width="52" height="52" aria-hidden="true" focusable="false">
                <rect width="512" height="512" rx="150" fill="#1877F2"/>
                <path fill="#fff" d="M355.6 330l11.4-74.4h-71.4v-48.3c0-20.4 10-40.2 42-40.2h32.4V103.9s-29.5-5-57.6-5c-58.8 0-97.2 35.6-97.2 100.2v56.5H157.6V330h71.4v179.9c14.3 2.2 29 3.4 44 3.4s29.7-1.2 44-3.4V330h65.6z"/>
              </svg>
            </a>
            <a class="social-link" href="https://www.youtube.com/@pazarcik-alabalik-tesisi" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
              <svg viewBox="0 0 512 512" width="52" height="52" aria-hidden="true" focusable="false">
                <rect width="512" height="512" rx="150" fill="#FF0000"/>
                <path fill="#fff" d="M203 168v176l150-88z"/>
              </svg>
            </a>
          </div>
        </div>
        <p class="foot-note" id="footNote"></p>
      </div>
    </footer>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <img id="lightboxImg" alt="">
  </div>

  <script src="js/menu-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
